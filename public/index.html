<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KasFlow — Catatan Keuangan Pribadi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- AUTH SECTION -->
  <div id="authSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-100 p-8">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-600 text-white font-bold text-xl mb-3">K</div>
        <h1 class="text-2xl font-bold text-slate-900">KasFlow</h1>
        <p class="text-sm text-slate-500 mt-1">Kelola arus kas harianmu dengan rapi</p>
      </div>

      <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
        <button id="tabLogin" type="button" onclick="switchAuthTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-slate-900 shadow-sm transition">Masuk</button>
        <button id="tabRegister" type="button" onclick="switchAuthTab('register')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-600 transition">Daftar</button>
      </div>

      <div id="authAlert" class="hidden mb-4 p-3 rounded-xl text-sm font-medium"></div>

      <!-- Form Login -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
          <input type="text" id="loginUsername" placeholder="Masukkan username" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Kata Sandi</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <button type="submit" id="btnLogin" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl transition shadow-sm">Masuk ke KasFlow</button>
      </form>

      <!-- Form Register -->
      <form id="registerForm" class="space-y-4 hidden">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nama Tampilan</label>
          <input type="text" id="regName" placeholder="Contoh: Sakha" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
          <input type="text" id="regUsername" placeholder="Contoh: sakha" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Kata Sandi (min. 6 karakter)</label>
          <input type="password" id="regPassword" minlength="6" placeholder="••••••••" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <button type="submit" id="btnRegister" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl transition shadow-sm">Buat Akun</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboardSection" class="hidden">
    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-30">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-emerald-600 text-white font-bold flex items-center justify-center">K</div>
          <span class="font-bold text-lg text-slate-900">KasFlow</span>
        </div>
        <div class="flex items-center gap-3">
          <span id="navUserBadge" class="text-sm font-medium text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg"></span>
          <button type="button" onclick="openAccountModal()" class="text-sm font-medium text-slate-700 hover:text-emerald-600 bg-slate-100 hover:bg-emerald-50 px-3 py-1.5 rounded-lg transition">Pengaturan Akun</button>
          <button type="button" onclick="logout()" class="text-sm font-medium text-rose-600 hover:bg-rose-50 px-3 py-1.5 rounded-lg transition">Keluar</button>
        </div>
      </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 space-y-6">
      <!-- Summary Cards -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
          <p class="text-sm font-medium text-slate-500">Total Saldo</p>
          <p id="totalBalance" class="text-2xl font-bold text-slate-900 mt-1">Rp 0</p>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
          <p class="text-sm font-medium text-slate-500">Total Pemasukan</p>
          <p id="totalIncome" class="text-2xl font-bold text-emerald-600 mt-1">Rp 0</p>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
          <p class="text-sm font-medium text-slate-500">Total Pengeluaran</p>
          <p id="totalExpense" class="text-2xl font-bold text-rose-600 mt-1">Rp 0</p>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Form Tambah Transaksi -->
        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm h-fit space-y-5">
          <h2 class="text-lg font-bold text-slate-900">Catat Transaksi</h2>
          <div id="txAlert" class="hidden p-3 rounded-xl text-sm font-medium"></div>

          <form id="txForm" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Kategori</label>
              <select id="txCategory" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500"></select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Nominal (Rp)</label>
              <input type="text" inputmode="numeric" id="amount" placeholder="500.000" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal</label>
              <input type="date" id="txDate" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Catatan (opsional)</label>
              <input type="text" id="txNote" placeholder="Contoh: Makan siang / Gaji bulanan" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            </div>
            <button type="submit" id="btnSaveTx" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl transition">Simpan Transaksi</button>
          </form>

          <!-- Tambah Kategori Baru -->
          <div class="pt-4 border-t border-slate-100">
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">Tambah Kategori Kustom</p>
            <form id="catForm" class="space-y-2.5">
              <input type="text" id="catName" placeholder="Nama kategori baru" required class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
              <div class="flex gap-2">
                <select id="catType" class="flex-1 px-3 py-2 text-sm rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                  <option value="expense">Pengeluaran</option>
                  <option value="income">Pemasukan</option>
                </select>
                <button type="submit" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold rounded-xl transition">Tambah</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Riwayat Transaksi -->
        <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold text-slate-900">Riwayat Transaksi</h2>
            <span id="txCount" class="text-xs font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-lg">0 transaksi</span>
          </div>
          <div id="txList" class="divide-y divide-slate-100"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL PENGATURAN AKUN -->
  <div id="accountModal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-100 p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-slate-900">Pengaturan Akun</h3>
        <button type="button" onclick="closeAccountModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>

      <div id="accountAlert" class="hidden mb-4 p-3 rounded-xl text-sm font-medium"></div>

      <form id="accountForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Username Baru (opsional)</label>
          <input type="text" id="newUsernameInput" placeholder="Kosongkan jika tidak ingin diubah" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Kata Sandi Baru (opsional, min. 6 karakter)</label>
          <input type="password" id="newPasswordInput" placeholder="Kosongkan jika tidak ingin diubah" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Konfirmasi Kata Sandi Baru</label>
          <input type="password" id="confirmPasswordInput" placeholder="Ulangi kata sandi baru" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Kata Sandi Saat Ini *</label>
          <input type="password" id="currentPasswordInput" placeholder="Wajib diisi untuk verifikasi" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeAccountModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition">Batal</button>
          <button type="submit" id="btnUpdateAccount" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl transition">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('kasflow_token') || '';
    let currentUser = JSON.parse(localStorage.getItem('kasflow_user') || 'null');

    function formatRupiah(num) {
      return 'Rp ' + Number(num || 0).toLocaleString('id-ID');
    }

    function showAlert(elId, msg, isSuccess = false) {
      const el = document.getElementById(elId);
      el.textContent = msg;
      el.className = `mb-4 p-3 rounded-xl text-sm font-medium ${isSuccess ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`;
      el.classList.remove('hidden');
    }

    function switchAuthTab(tab) {
      document.getElementById('authAlert').classList.add('hidden');
      const isLogin = tab === 'login';
      document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
      document.getElementById('registerForm').classList.toggle('hidden', isLogin);
      document.getElementById('tabLogin').className = isLogin
        ? 'flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-slate-900 shadow-sm transition'
        : 'flex-1 py-2 text-sm font-semibold rounded-lg text-slate-600 transition';
      document.getElementById('tabRegister').className = !isLogin
        ? 'flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-slate-900 shadow-sm transition'
        : 'flex-1 py-2 text-sm font-semibold rounded-lg text-slate-600 transition';
    }

    // Format ribuan otomatis saat mengetik nominal
    const amountInput = document.getElementById('amount');
    amountInput.addEventListener('input', function () {
      const digits = this.value.replace(/\D/g, '');
      this.value = digits ? digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
    });

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) return showAlert('authAlert', data.error || 'Gagal login');
        saveSession(data.token, data.user);
      } catch (err) {
        showAlert('authAlert', 'Terjadi kesalahan jaringan.');
      }
    });

    // Register
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, username, password })
        });
        const data = await res.json();
        if (!res.ok) return showAlert('authAlert', data.error || 'Gagal mendaftar');
        saveSession(data.token, data.user);
      } catch (err) {
        showAlert('authAlert', 'Terjadi kesalahan jaringan.');
      }
    });

    function saveSession(newToken, user) {
      token = newToken;
      currentUser = user;
      localStorage.setItem('kasflow_token', token);
      localStorage.setItem('kasflow_user', JSON.stringify(user));
      initApp();
    }

    function logout() {
      token = '';
      currentUser = null;
      localStorage.removeItem('kasflow_token');
      localStorage.removeItem('kasflow_user');
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('authSection').classList.remove('hidden');
    }

    // Modal Pengaturan Akun
    function openAccountModal() {
      document.getElementById('accountAlert').classList.add('hidden');
      document.getElementById('newUsernameInput').value = currentUser?.username || '';
      document.getElementById('newPasswordInput').value = '';
      document.getElementById('confirmPasswordInput').value = '';
      document.getElementById('currentPasswordInput').value = '';
      document.getElementById('accountModal').classList.remove('hidden');
    }

    function closeAccountModal() {
      document.getElementById('accountModal').classList.add('hidden');
    }

    document.getElementById('accountForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newUsername = document.getElementById('newUsernameInput').value.trim();
      const newPassword = document.getElementById('newPasswordInput').value;
      const confirmPassword = document.getElementById('confirmPasswordInput').value;
      const currentPassword = document.getElementById('currentPasswordInput').value;

      if (newPassword && newPassword !== confirmPassword) {
        return showAlert('accountAlert', 'Konfirmasi kata sandi baru tidak cocok.');
      }

      try {
        const res = await fetch('/api/auth/update-account', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ currentPassword, newUsername, newPassword })
        });
        const data = await res.json();
        if (!res.ok) return showAlert('accountAlert', data.error || 'Gagal memperbarui akun');

        token = data.token;
        currentUser = data.user;
        localStorage.setItem('kasflow_token', token);
        localStorage.setItem('kasflow_user', JSON.stringify(currentUser));
        document.getElementById('navUserBadge').textContent = `@${currentUser.username}`;
        showAlert('accountAlert', data.message || 'Akun berhasil diperbarui!', true);
        setTimeout(closeAccountModal, 1000);
      } catch (err) {
        showAlert('accountAlert', 'Terjadi kesalahan jaringan.');
      }
    });

    // Load Categories & Transactions
    async function loadCategories() {
      const res = await fetch('/api/categories', { headers: { 'Authorization': 'Bearer ' + token } });
      if (res.status === 401 || res.status === 403) return logout();
      const cats = await res.json();
      const select = document.getElementById('txCategory');
      select.innerHTML = cats.map(c =>
        `<option value="${c.id}">${c.name} (${c.type === 'income' ? 'Pemasukan' : 'Pengeluaran'})</option>`
      ).join('');
    }

    async function loadTransactions() {
      const res = await fetch('/api/transactions', { headers: { 'Authorization': 'Bearer ' + token } });
      if (res.status === 401 || res.status === 403) return logout();
      const txs = await res.json();

      let income = 0, expense = 0;
      txs.forEach(t => {
        const amt = Number(t.amount || 0);
        if (t.type === 'income') income += amt;
        else expense += amt;
      });

      document.getElementById('totalIncome').textContent = formatRupiah(income);
      document.getElementById('totalExpense').textContent = formatRupiah(expense);
      document.getElementById('totalBalance').textContent = formatRupiah(income - expense);
      document.getElementById('txCount').textContent = `${txs.length} transaksi`;

      const list = document.getElementById('txList');
      if (txs.length === 0) {
        list.innerHTML = '<p class="text-sm text-slate-400 py-8 text-center">Belum ada transaksi tercatat.</p>';
        return;
      }

      list.innerHTML = txs.map(t => {
        const isInc = t.type === 'income';
        const dateStr = String(t.transaction_date || '').slice(0, 10);
        return `
          <div class="py-3.5 flex items-center justify-between gap-4">
            <div>
              <p class="font-semibold text-slate-800">${t.category_name || 'Tanpa Kategori'}</p>
              <p class="text-xs text-slate-500">${dateStr}${t.note ? ' • ' + t.note : ''}</p>
            </div>
            <div class="flex items-center gap-3">
              <span class="font-bold ${isInc ? 'text-emerald-600' : 'text-rose-600'}">
                ${isInc ? '+' : '-'} ${formatRupiah(t.amount)}
              </span>
              <button type="button" onclick="deleteTx(${t.id})" class="text-xs text-slate-400 hover:text-rose-600 px-2 py-1 rounded">Hapus</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Submit Transaksi
    document.getElementById('txForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const category_id = document.getElementById('txCategory').value;
      const cleanAmount = Number(String(amountInput.value).replace(/\./g, ''));
      const transaction_date = document.getElementById('txDate').value;
      const note = document.getElementById('txNote').value.trim();

      if (!cleanAmount || cleanAmount <= 0) {
        return showAlert('txAlert', 'Nominal transaksi harus lebih dari 0.');
      }

      const res = await fetch('/api/transactions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ category_id, amount: cleanAmount, transaction_date, note })
      });
      const data = await res.json();
      if (!res.ok) return showAlert('txAlert', data.error || 'Gagal menyimpan transaksi');

      amountInput.value = '';
      document.getElementById('txNote').value = '';
      document.getElementById('txAlert').classList.add('hidden');
      loadTransactions();
    });

    // Submit Kategori Baru
    document.getElementById('catForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('catName').value.trim();
      const type = document.getElementById('catType').value;
      const res = await fetch('/api/categories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ name, type })
      });
      if (res.ok) {
        document.getElementById('catName').value = '';
        loadCategories();
      }
    });

    async function deleteTx(id) {
      await fetch(`/api/transactions/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      loadTransactions();
    }

    function initApp() {
      if (!token || !currentUser) {
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('dashboardSection').classList.add('hidden');
        return;
      }
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      document.getElementById('navUserBadge').textContent = `@${currentUser.username || currentUser.name}`;
      document.getElementById('txDate').valueAsDate = new Date();
      loadCategories();
      loadTransactions();
    }

    initApp();
  </script>
</body>
</html>
